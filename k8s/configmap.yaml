apiVersion: v1
kind: ConfigMap
metadata:
  name: vanguard-config
data:
  VANGUARD_HTTP_ADDR: ":8080"
  VANGUARD_REDIS_ADDR: "redis:6379"
  VANGUARD_POSTGRES_DSN: "postgres://vanguard:vanguard@host.minikube.internal:5432/vanguard?sslmode=disable"
  VANGUARD_REDIS_LIST_KEY: "vanguard:events:ingest"
  VANGUARD_REDIS_DLQ_KEY: "vanguard:events:dlq"
  VANGUARD_RATE_LIMIT_RATE: "10"
  VANGUARD_RATE_LIMIT_CAPACITY: "20"
  VANGUARD_RATE_LIMIT_ENABLED: "true"
  VANGUARD_RETRY_MAX_ATTEMPTS: "5"
  VANGUARD_RETRY_MAX_DELAY: "30"