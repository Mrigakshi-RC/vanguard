apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      containers:
        - name: edge
          image: vanguard-edge:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vanguard-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # initialDelaySeconds: 10
            # periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # initialDelaySeconds: 10
            # periodSeconds: 10
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting; sleep 2; done"]
