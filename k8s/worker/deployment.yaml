apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting; sleep 2; done"]
      containers:
        - name: worker
          image: vanguard-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: vanguard-config